<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poké Spire</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--sf:#fff;--tx:#222;--mu:#777;--bd:#d8d3c8;--ac:#e8542b;--ok:#2e9e5b;--bad:#d33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--sf:#24262c;--tx:#eee;--mu:#9a9aa2;--bd:#3a3d45}}
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:880px;margin:0 auto;padding:12px}
.top{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;margin-bottom:10px;color:var(--mu)}
.top b{color:var(--tx)}
h2{margin:8px 0}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer;margin:4px 4px 4px 0}
.btn.g{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.4;cursor:default}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.arena{display:flex;justify-content:space-around;gap:10px;flex-wrap:wrap}
.mon{text-align:center;flex:1;min-width:150px}
.sprite{font-size:60px;line-height:1.1}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.tag{display:inline-block;font-size:11px;color:#fff;border-radius:10px;padding:1px 7px;margin:1px;text-transform:uppercase}
.hand{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.card{width:128px;background:var(--sf);border:2px solid var(--bd);border-radius:10px;padding:8px;cursor:pointer;font-size:13px;display:flex;flex-direction:column;gap:4px}
.card:hover:not(.off){border-color:var(--ac);transform:translateY(-3px)}
.card.off{opacity:.45;cursor:default}
.card .nm{font-weight:700;font-size:14px}
.cost{float:right;background:var(--ac);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-weight:700}
.eff{font-weight:700;color:var(--ok)}.eff.w{color:var(--bad)}
.log{font-size:13px;color:var(--mu);min-height:36px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat{font-size:13px}
.spr{image-rendering:pixelated;max-height:100px;scale:2;transform-origin:50% 100%;position:relative;z-index:1;display:block}
.spr.px{width:112px;height:112px;min-height:0;scale:1}
.ic{width:56px;height:56px;image-rendering:pixelated;background:#e6efe0;border-radius:8px;border:2px solid rgba(255,255,255,.55)}
.field{position:relative;height:400px;border-radius:14px;overflow:hidden;border:2px solid #2d4a2a;background:radial-gradient(ellipse 70% 30% at 50% 58%,rgba(255,255,255,.25),transparent 70%),linear-gradient(#7cc4f0 0,#d3f1fb 52%,#8fcb72 52%,#4f9444 100%)}
.field:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.04) 0 2px,transparent 2px 6px);pointer-events:none;z-index:-1}
.side{position:absolute;display:flex;flex-direction:column;align-items:center}
.es{right:12%;top:150px}.ps{left:9%;bottom:76px}
.mon{position:relative;z-index:1;isolation:isolate;flex:none;min-width:0;display:flex;justify-content:center;align-items:flex-end;height:110px;width:110px}
.plat{width:150px;height:36px;border-radius:50%;margin-top:-30px;background:radial-gradient(ellipse at 50% 40%,#b9e08c,#78b256 60%,#5c9a42);box-shadow:0 8px 0 -2px rgba(0,0,0,.28),inset 0 -4px 6px rgba(0,0,0,.18)}
.ps .plat{width:190px;height:44px;margin-top:-36px}
.info{position:absolute;background:rgba(255,255,255,.94);color:#222;border:2px solid #333;border-radius:10px;padding:6px 10px;font-size:12px;min-width:150px;box-shadow:0 3px 0 rgba(0,0,0,.3);z-index:3}
.info .bar{background:#ddd;border:1px solid #555}
.bar i{transition:width .35s,background .35s}
.ei{right:8px;top:8px}.pi{left:8px;bottom:8px}
.intent{margin:8px 0}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
.itm{width:28px;height:28px;image-rendering:pixelated;vertical-align:middle}
.hit{animation:hit .6s}
@keyframes hit{0%,100%{translate:0;filter:none;opacity:1}8%{translate:-12px;filter:brightness(4)}16%{translate:12px;opacity:.2}24%{translate:-10px;opacity:1;filter:brightness(4)}32%{translate:10px;opacity:.2}40%{translate:-6px;opacity:1;filter:none}55%{translate:6px;opacity:.4}70%{translate:0;opacity:1}}
.dmg{position:absolute;left:50%;top:0;font-weight:900;font-size:32px;color:#fff;text-shadow:-2px 0 #b01c22,2px 0 #b01c22,0 -2px #b01c22,0 2px #b01c22,0 4px 0 #000;animation:flt 1.1s forwards;pointer-events:none;z-index:6;white-space:nowrap}
@keyframes flt{0%{opacity:0;transform:translate(-50%,16px) scale(.5)}15%{opacity:1;transform:translate(-50%,-8px) scale(1.4)}35%{transform:translate(-50%,-14px) scale(1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.hand{gap:16px;perspective:900px;padding-top:10px}
.card{--glow:#d0d0d8;--bd:#d0d0d8;--c1:#a8a878;--c2:#6d6d4e;font-size:14px;width:180px;height:250px;padding:10px 9px 9px;gap:6px;display:flex;flex-direction:column;align-items:stretch;position:relative;color:#222;border:3px solid var(--bd);border-radius:12px;cursor:pointer;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 14px rgba(0,0,0,.35);transition:transform .18s,box-shadow .18s,filter .18s}
.card[data-t=normal]{--bd:#d4d4dc;--glow:#e8e8f0}
.card[data-t=fire]{--c1:#f08030;--c2:#9c3600;--bd:#e8b84a;--glow:#ffb050}
.card[data-t=water]{--c1:#6890f0;--c2:#183888;--bd:#cfe0ff;--glow:#8ab8ff}
.card[data-t=grass]{--c1:#78c850;--c2:#2e6015;--bd:#d8e8a0;--glow:#a0e070}
.card[data-t=electric]{--c1:#f8d030;--c2:#a08000;--bd:#fff0a0;--glow:#fff070}
.card[data-t=dragon]{--c1:#7038f8;--c2:#3a1a90;--bd:#e0c860;--glow:#b090ff}
.card[data-t=flying]{--c1:#a890f0;--c2:#5a4aa0;--bd:#e0d8ff;--glow:#c8b8ff}
.card[data-t=poison]{--c1:#a040a0;--c2:#501850;--bd:#e0a8e0;--glow:#d080d0}
.card[data-t=rock]{--c1:#b8a038;--c2:#6a5a18;--bd:#e8dca0;--glow:#e8d070}
.card[data-t=ground]{--c1:#e0c068;--c2:#8a6a20;--bd:#f4e0a0;--glow:#f4d078}
.card[data-t=bug]{--c1:#a8b820;--c2:#586010;--bd:#e0e890;--glow:#d0e050}
.card[data-t=psychic]{--c1:#f85888;--c2:#a02050;--bd:#ffc0d4;--glow:#ff90b4}
.card:before{content:"";position:absolute;inset:0;border-radius:9px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.22),transparent 40%,rgba(255,255,255,.08) 70%,transparent)}
.card:after{content:"";position:absolute;inset:3px;border:1px solid rgba(255,255,255,.4);border-radius:8px;pointer-events:none}
.card:hover:not(.off):not(.static){transform:translateY(-12px) scale(1.05);z-index:5;box-shadow:0 0 22px 4px var(--glow),0 16px 24px rgba(0,0,0,.4)}
.card.static:hover{transform:none;border-color:var(--bd)}
.card.off{filter:grayscale(1) brightness(.8);opacity:.5;cursor:not-allowed}
.card .cost{position:absolute;top:-10px;left:-10px;z-index:3;float:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:900;line-height:1;color:#fff;background:radial-gradient(circle at 33% 28%,#ff9a9a,#e02020 55%,#7a0a0a);border:2px solid #e8c24a;box-shadow:0 2px 5px rgba(0,0,0,.55),inset 0 -3px 4px rgba(80,0,0,.45);text-shadow:0 1px 2px #000}
.card .nm{padding:3px 4px 3px 18px;font-family:Georgia,"Times New Roman",serif;font-weight:800;font-size:.85em;letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.1;color:#222;background:rgba(255,255,255,.88);border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.card .art{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;border:2px solid var(--bd);border-radius:10px;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.95),var(--c1) 115%);box-shadow:inset 0 0 10px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.4)}
.card .aw{width:68%;height:92%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.card .meta{align-self:center;display:flex;align-items:center;gap:5px;font-size:.62em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#222;background:rgba(255,255,255,.85);border-radius:9px;padding:2px 9px;line-height:1.2;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.card .meta i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.card .txt span{display:block}
.card .txt{font-size:.72em;line-height:1.3;text-align:center;color:#222;background:rgba(255,249,228,.93);border-radius:6px;padding:.45em .5em;min-height:4.4em;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.card .txt b{font-weight:900}
.card .eff{font-size:.7em;font-weight:800;text-align:center;color:#116b30;background:rgba(255,255,255,.88);border-radius:6px;padding:1px 6px;align-self:center}.card .eff.w{color:#b01c1c}
.card .btn{margin:0;padding:6px;z-index:2}
.card .upg{font-size:.65em;text-align:center;color:#222;background:rgba(255,255,255,.85);border-radius:4px;padding:2px}
@media(max-width:560px){.card{font-size:11px;width:140px;height:196px;padding:9px 7px 7px}.card .cost{width:26px;height:26px;font-size:14px}}

:root{--px:"Press Start 2P","Courier New",monospace}
h2,.info,.top b,.card .cost,.card .nm,.bub b,.stt b{font-family:var(--px)}
h2{font-size:15px;line-height:1.5}
.top b{font-size:11px}
.info{width:172px;font-size:9px;line-height:1.6}
.info b{display:block;font-size:10px;line-height:1.4}
.card .nm{font-size:.58em;line-height:1.35;letter-spacing:0}
.card .cost{font-size:12px}
.bub{position:absolute;left:50%;top:-4px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.95);border:2px solid #333;border-radius:8px;padding:3px 8px;box-shadow:0 2px 0 rgba(0,0,0,.3);white-space:nowrap}
.bub b{font-size:13px;color:#c4260c}
.sw{width:18px;height:18px}
.sts{display:flex;gap:8px;justify-content:center;min-height:38px;margin-top:6px}
.stt{display:flex;flex-direction:column;align-items:center;gap:2px}
.stt svg{width:22px;height:22px}
.stt b{font-size:9px;color:#fff;text-shadow:1px 1px 0 #000}
.lg{display:inline-flex;align-items:center;gap:4px;margin:4px 10px 0 0}
.lg img{width:20px;height:20px;image-rendering:pixelated}
.type-icon-badge{height:18px;width:auto;vertical-align:middle;image-rendering:pixelated}
.nr{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:3px}
.info .nr b{display:inline-block}
.card .aw.ph{width:100%;height:100%;object-fit:cover;filter:none}

/* ===== game shell ===== */
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:var(--px);font-size:11px;line-height:1.6;background:#0b0d12;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 2px,transparent 2px 9px),radial-gradient(circle at 50% 0,#1d2433,#080a0e)}
button{font-family:inherit}
#app{--bg:#252a38;--sf:#313748;--tx:#f2f2f2;--mu:#b4b9c8;--bd:#4a5166;color:var(--tx);max-width:none;margin:0;padding:0;position:relative;width:min(98vw,calc(96vh*16/9),1180px);aspect-ratio:16/9;display:flex;flex-direction:column;overflow:hidden;background:#1c2030;border:5px solid #3a404c;border-radius:8px;box-shadow:0 0 0 2px #151922,0 0 0 8px #5a6070,0 24px 60px rgba(0,0,0,.75)}
.scr{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(#2b3142,#1c2030);position:relative}
.scr:has(>.field){padding:0;overflow:hidden}
.stat{font-size:9px}.btn{font-size:10px;font-family:var(--px)}
.hud{display:flex;align-items:center;gap:14px;padding:6px 12px;flex:none;font-size:9px;background:linear-gradient(#4a5164,#2f3444);border-bottom:3px solid #11141c;box-shadow:inset 0 -2px 0 #6a728a}
.hpb{display:flex;align-items:center;gap:8px;flex:0 1 310px;min-width:0}
.av{width:36px;height:36px;image-rendering:pixelated;background:#e6efe0;border:2px solid #11141c}
.hpt{flex:1;min-width:70px}.hpt b{display:block;font-size:8px;margin-bottom:3px}
.hud .bar{height:9px;margin:0;border:2px solid #11141c;border-radius:0;background:#222}
.hv{font-size:9px;white-space:nowrap}
.rl{flex:1;display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.rel{background:#11141c;border:1px solid #c8a850;color:#ffe08a;padding:3px 6px;font-size:7px}
.gold{display:flex;align-items:center;gap:7px;padding:5px 10px;font-size:11px;color:#3a2600;background:linear-gradient(#ffe99a,#d9a42a 55%,#b07c14);border:2px solid #5a3e00;box-shadow:inset 0 1px 0 #fff6c8;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.gold:before{content:"";width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c0,#e0a020);border:2px solid #7a5200}
.dk{display:flex;align-items:center;gap:5px}.dk svg{width:26px;height:26px}
/* ===== battle ===== */
.field{flex:1;height:auto;min-height:340px;border:0;border-radius:0}
.field .log{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:44%;text-align:center;font-size:8px;line-height:1.6;color:#fff;background:rgba(10,14,24,.7);border:2px solid #11141c;padding:5px 9px;min-height:0;z-index:4}
.gba{position:absolute;width:190px;padding:5px 8px 6px;font-size:9px;color:#202020;background:#f8f0d0;border:3px solid #384048;border-radius:0;box-shadow:inset 0 0 0 2px #d8c888,4px 4px 0 rgba(0,0,0,.35);z-index:3}
.gba .nr{margin:0 0 5px}.gba .nr b{display:inline-block;font-size:9px;text-transform:uppercase}
.hpr{display:flex;align-items:center;gap:5px}
.hl{font-size:7px;color:#fff;background:#d85830;padding:3px 3px 2px;line-height:1}
.gba .bar{flex:1;height:8px;margin:0;overflow:hidden;background:#58606c;border:2px solid #202830;border-radius:0}
.hn{text-align:right;font-size:8px;margin-top:4px}
.ei{right:14px;top:14px;left:auto}.pi{left:14px;bottom:76px;right:auto}
.es{right:13%;top:150px}.ps{left:11%;bottom:150px}
.pile{position:absolute;bottom:8px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:1px}
.pile .pl{width:46px;height:46px}
.pile b{position:absolute;top:0;right:-6px;min-width:20px;text-align:center;background:#11141c;color:#fff;border:2px solid #c8a850;font-size:9px;padding:2px 3px}
.pile small{font-size:6px;color:#fff;text-shadow:1px 1px 0 #000}
.pd{left:14px}.pc{right:14px}.pc .pl{filter:grayscale(.55)}
.ctrl{position:absolute;right:14px;bottom:84px;z-index:8;display:flex;flex-direction:column;align-items:center;gap:8px}
.orb{display:flex;align-items:baseline;justify-content:center;width:56px;height:56px;padding-top:17px;border-radius:50%;font-size:18px;color:#fff;background:radial-gradient(circle at 33% 28%,#d4f1ff,#2f86e8 50%,#0b2a73);border:4px solid #e8c24a;box-shadow:0 0 0 2px #5a4308,0 0 14px rgba(80,170,255,.8);text-shadow:1px 1px 0 #000}
.orb small{font-size:8px}
.endt{font-family:var(--px);font-size:10px;line-height:1.5;padding:10px 12px;color:#fff;cursor:pointer;background:linear-gradient(#ffb04a,#e0501a);border:3px solid #5a1a00;border-radius:4px;box-shadow:0 4px 0 #7a2a00,inset 0 2px 0 rgba(255,255,255,.5);text-shadow:1px 1px 0 #7a2a00}
.endt:hover{filter:brightness(1.12)}.endt:active{transform:translateY(3px);box-shadow:0 1px 0 #7a2a00}
.endt.hot{animation:hotp 1s ease-in-out infinite}
@keyframes hotp{50%{box-shadow:0 4px 0 #7a2a00,0 0 18px 4px #ffb04a}}
.fan{position:absolute;left:210px;right:150px;bottom:-14px;z-index:5;display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
#app .fan .card{pointer-events:auto;scale:.72;transform-origin:50% 100%;margin:0 -25px;transform:translateY(var(--y,0)) rotate(var(--r,0deg));transition:transform .2s,scale .2s,box-shadow .2s}
#app .fan .card:hover{scale:1;z-index:30;transform:translateY(-30px) rotate(0deg);box-shadow:0 0 22px 4px var(--glow),0 16px 24px rgba(0,0,0,.5)}
#app .fan .card.off:hover{transform:translateY(-14px) rotate(0deg)}
/* ===== map ===== */
.gbaframe{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px;background:linear-gradient(#9aa0ae,#666c7a);border:4px solid #2a2e38;border-radius:4px;box-shadow:inset 0 0 0 3px #c8ceda,inset 0 0 0 5px #4a5060}
.ftitle{font-size:9px;color:#fff;background:#3a4e8a;border:2px solid #11141c;padding:5px 8px;text-shadow:1px 1px 0 #000}
.mapbg{flex:1;min-height:200px;position:relative;border:3px solid #1a1f2a;background-color:#bcd2c4;background-image:linear-gradient(rgba(40,80,70,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(40,80,70,.16) 1px,transparent 1px),radial-gradient(circle at 50% 50%,rgba(255,255,255,.4),transparent 70%);background-size:24px 24px,24px 24px,100% 100%}
.mapbg svg{position:absolute;inset:0;width:100%;height:100%}
.pth{fill:none;stroke:#5a6a64;stroke-width:3;stroke-dasharray:7 6;opacity:.8}
.pth.on{stroke:#e0701a;stroke-width:4;opacity:1;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-26}}
.nd circle{fill:#f8f0d0;stroke:#384048;stroke-width:4}
.nd.av{cursor:pointer;animation:pulse 1.1s ease-in-out infinite}.nd.av circle{stroke:#e0701a}.nd.cur circle{stroke:#2e9e5b}
@keyframes pulse{50%{filter:drop-shadow(0 0 10px #ff9a3a)}}
.bob{animation:bob2 1s ease-in-out infinite}@keyframes bob2{50%{transform:translateY(-6px)}}
.tip{display:none;position:absolute;z-index:9;width:210px;padding:6px 8px;font-size:7px;line-height:1.7;color:#202020;background:#f8f0d0;border:3px solid #384048;box-shadow:3px 3px 0 rgba(0,0,0,.4);pointer-events:none}
.tip b{display:block;font-size:8px;margin-bottom:3px;color:#a03010}
.legend{display:flex;flex-wrap:wrap;font-size:7px;color:#fff}
@media(max-aspect-ratio:1/1){#app{width:100vw;aspect-ratio:auto;min-height:100vh;border:0;border-radius:0;box-shadow:none}.fan{left:0;right:0;bottom:-30px}#app .fan .card{scale:.52;margin:0 -44px}.pi{bottom:96px}.ps{bottom:200px}.es{top:130px;right:6%}.ctrl{bottom:150px}.gba{width:160px}.hud{flex-wrap:wrap;gap:8px}.hpb{flex-basis:100%}}

/* ===== polish ===== */
.gba{border-radius:14px 4px 14px 4px;box-shadow:inset 0 0 0 2px #fffbe8,inset 0 -4px 0 rgba(150,120,60,.35),4px 4px 0 rgba(0,0,0,.35)}
.hl{background:linear-gradient(#ffd840,#f89800);color:#8a2800;border-radius:3px;padding:3px 4px 2px;font-weight:700}
.gba .bar{border-radius:3px;height:7px}
.card .cost{background:none;border:0;box-shadow:none;width:38px;height:38px;top:-13px;left:-13px;display:block;padding:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.cost .en{position:absolute;inset:0;width:100%;height:100%}

 show(`<div class="scene">${eimg(CLERK,"back")}${dlg(msg||"Bem-vindo ao Poké Mart! Confira nossas ofertas de hoje.")}</div><div class="shelf">${M.cards.map((x,i)=>`<div class="prod cardp">${card({id:x.id},{cls:"static"})}${price(x.p,`buyC(${i})`,x.sold)}</div>`).join("")}${prod(itm("potion","Poção"),"Poção","Cura 20 HP. Fica no cinto.",price(25,"buyI('pot',25,20)",!M.pot||full))}${prod(itm("super-potion","Super Poção"),"Super Poção","Cura 40 HP. Fica no cinto.",price(45,"buyI('sup',45,40)",!M.sup||full))}${M.rel.map(r=>prod(itm(REL[r].i,REL[r].n),REL[r].n,REL[r].d,price(REL[r].p,`buyR('${r}')`))).join("")}${prod(`<svg viewBox="0 0 24 24" width="44" height="44"><rect x="5" y="3" width="14" height="18" rx="1.5" fill="#f0e2b0" stroke="#222" stroke-width="1.8"/><path d="M8 12h8" stroke="#c02020" stroke-width="3"/></svg>`,"Remover carta","Remove 1 carta do seu deck.",price(50,"rmUI()",!M.rm||G.deck.length<=5))}</div><div><button class="btn g" onclick="next()">Sair</button></div>`)}
function rmUI(){show(`<div class="scene">${dlg("Qual carta devemos remover do seu deck?")}</div><div class="hand">${G.deck.map((c,i)=>card(c,{click:`rmCard(${i})`})).join("")}</div><div><button class="btn g" onclick="martUI()">Voltar</button></div>`)}
function rmCard(i){if(G.deck.length<=5)return martUI("Seu deck precisa ter pelo menos 5 cartas.");G.gold-=50;G.deck.splice(i,1);M.rm=false;martUI("Carta removida do seu deck.")}
function buyC(i){const x=M.cards[i];G.gold-=x.p;x.sold=true;G.deck.push({id:x.id});martUI("Carta comprada!")}
function buyI(k,p,h){const i=G.potions.indexOf(null);if(i<0)return martUI("Cinto cheio! (3 slots)");G.gold-=p;M[k]=false;G.potions[i]={n:k=="pot"?"Poção":"Super Poção",h,img:k=="pot"?"potion":"super-potion"};martUI("Poção guardada no cinto.")}
function buyR(r){G.gold-=REL[r].p;G.rel.push(r);M.rel=M.rel.filter(x=>x!=r);martUI("Relíquia obtida!")}
/* ---------- eventos ---------- */
const EVSVG={spring:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80"><ellipse cx="60" cy="58" rx="50" ry="18" fill="#5ab4e8" stroke="#2a6a9a" stroke-width="3"/><ellipse cx="60" cy="54" rx="40" ry="12" fill="#8fd4f4"/><path d="M40 40q-6-10 0-18M60 36q-6-12 0-22M80 40q-6-10 0-18" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/></svg>',tm:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#d94a4a" stroke="#222" stroke-width="3"/><circle cx="32" cy="32" r="8" fill="#eee" stroke="#222" stroke-width="3"/><text x="32" y="20" text-anchor="middle" font-size="10" fill="#fff">TM</text></svg>'};
const evFB=k=>k=="vb"?(cache.vtf||(cache.vtf=px(SP.voltorb))):k=="back"?(cache.trf||(cache.trf=px(SP.trainerfb))):cache["e"+k]||(cache["e"+k]="data:image/svg+xml,"+encodeURIComponent(EVSVG[k]));
const eimg=(u,k)=>`<img class="evimg" alt="" src="${u}" onerror="this.onerror=null;this.src='${evFB(k)}';this.classList.add('px')">`;
const dlg=t=>`<div class="dlg"><p>${t}</p></div>`;
const EV=[
{k:"spring",u:"https://i.gifer.com/embedded/download/OWbN.gif",x:"Você encontra uma fonte termal, algumas pessoas suspeitas estão tomando banho...",o:[{l:"Banhar-se (cura 30% do HP)",f:()=>{const h=Math.ceil(G.max*.3);G.hp=Math.min(G.max,G.hp+h);return{m:`Você aproveitou as águas com as idosas. (+${h} HP)`}}},{l:"Apenas meditar (melhora uma carta)",f:()=>({m:"Você decide não entrar na água. Elas parecem decepcionadas.",up:1})}]},
{k:"tm",u:"https://www.serebii.net/itemdex/sprites/sv/tm125.png",x:"Você encontra um TM caído, mas parece ter algo preso a ele...",o:[{l:"Pegar (50% de ativar uma armadilha)",f:()=>{if(Math.random()<.5)return{trap:1,m:"Era uma armadilha! Um Voltorb selvagem te ataca!"};const id=pick(NONC);G.deck.push({id});return{m:"Você pega o TM e escapa em segurança.",card:id}}},{l:"Sair",f:()=>({m:"Você decide não arriscar e segue seu caminho."})}]},
{k:"back",u:"https://static.wikia.nocookie.net/pokemon/images/c/c0/Backpacker_male_XY_artwork.png/revision/latest?cb=20250302151055",x:"Você encontra um mochileiro que diz ter uma carta rara. Ele a oferece para você.",o:[{l:"Comprar (20 Pokédollars)",f:()=>{if(G.gold<20)return{m:"Você não tem Pokédollars suficientes."};G.gold-=20;const id=pick(NONC);G.deck.push({id});return{m:"O mochileiro agradece cordialmente.",card:id}}},{l:"Sair",f:()=>({m:"O mochileiro desaparece num piscar de olhos..."})}]}];
const BOOM=`<svg class="boom" viewBox="0 0 64 64" shape-rendering="crispEdges"><path d="M32 2l5 14 14-8-6 14 15 4-13 8 9 12-15-2-2 15-7-13-9 11-1-15-14 3 9-12-11-9 15-3-3-15 10 9z" fill="#f8d030"/><path d="M32 14l4 9 9-2-6 7 7 6-9 1v9l-6-7-7 6 2-9-9-3 8-5-4-9 8 3z" fill="#f08030"/><path d="M32 24l3 6 6 2-6 3-1 6-4-5-6 1 3-5-4-4 6-1z" fill="#fff"/></svg><i class="smoke s1"></i><i class="smoke s2"></i><i class="smoke s3"></i>`;
function evBoom(){sfx("hit");show(`<div class="evt"><div class="boomwrap">${eimg(SPU.voltorb,"vb")}${BOOM}</div>${dlg("Era uma armadilha! Um Voltorb selvagem usou Explosion!")}<div class="menu"><button onclick="evBoom2()">Continuar</button></div></div>`)}
function evBoom2(){const d=Math.min(12,G.hp-1),id=pick(NONC);G.hp-=d;G.deck.push({id});evScene(_e,dlg(`Você sofreu ${d} de dano, mas conseguiu pegar o TM e escapar!`)+`<div class="evcard">${card({id},{cls:"static"})}</div><div class="menu"><button onclick="next()">Continuar</button></div>`)}
const evScene=(e,b)=>show(`<div class="evt">${eimg(e.u,e.k)}${b}</div>`);
function event(){const e=pick(EV);window._e=e;evScene(e,dlg(e.x)+`<div class="menu">${e.o.map((o,i)=>`<button onclick="evPick(${i})">${o.l}</button>`).join("")}</div>`)}
function evPick(i){const e=_e,r=e.o[i].f();
 if(r.trap)return evBoom();
 evScene(e,dlg(r.m)+(r.card?`<div class="evcard">${card({id:r.card},{cls:"static"})}</div>`:"")+`<div class="menu"><button onclick="${r.up?"upgradeUI()":"next()"}">Continuar</button></div>`)}
function upgradeUI(){const u=G.deck.map((c,i)=>({c,i})).filter(x=>!x.c.up);show(`<h2>Escolha uma carta para melhorar</h2>${u.length?`<div class="hand">${u.map(x=>card({...x.c,up:true},{click:`G.deck[${x.i}].up=true;next()`,extra:`<div class="upg">${nm(x.c)} → ${st({...x.c,up:true}).n}+</div>`})).join("")}</div>`:`<p>Todas as cartas já foram melhoradas.</p><button class="btn" onclick="next()">Continuar</button>`}`)}
newRun();
</script></body></html>
